name: lunchquest
description: "Lunch Quest - Discover your perfect lunch spot"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.7

  # Supabase
  supabase_flutter: ^2.8.4

  # Networking
  dio: ^5.7.0
  url_launcher: ^6.3.1

  # Local Storage
  shared_preferences: ^2.3.2

  # DI
  get_it: ^8.0.2

  # Firebase & Push Notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

  # Utils
  equatable: ^2.0.5
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
